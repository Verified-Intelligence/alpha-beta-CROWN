general:
  root_path: ../../vnncomp2024_benchmarks/benchmarks/cifar100
  csv_name: instances.csv
model:
  onnx_optimization_flags: ["merge_bn"]
attack:
  pgd_order: middle
  pgd_restarts: 10
solver:
  auto_enlarge_batch_size: True
  batch_size: 128
  beta-crown:
    lr_alpha: 0.1
    lr_beta: 0.2
    iteration: 10
  alpha-crown:
    lr_alpha: 0.25
    iteration: 20
    full_conv_alpha: False
bab:
  shared_slope_bab:
    enabled: true
  branching:
    method: kfsb
    candidates: 7
    reduceop: max
    decision_sub_batch_size: 1280
  mixed_precision:
    enable_bab_bound_mixed_precision: true
    bab_bound_mixed_precision_dtype: tf32
    low_precision_prune_margin_abs: 0.01
  clip_n_verify:
    clip_interm_domain:
      enabled: True
