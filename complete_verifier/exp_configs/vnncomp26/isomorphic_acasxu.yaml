# Configuration for the VNN-COMP 2026 ACAS Xu isomorphic-networks benchmark.
#
# The benchmark is small and input-dimensional, so ACASXu-style input splitting is
# appropriate. PGD is enabled before BaB.
general:
  root_path: ../../vnncomp2026_benchmarks/benchmarks/isomorphic_acasxu_2026/2.0
  csv_name: instances.csv
  complete_verifier: bab
  verify_onnxruntime_output: true
solver:
  batch_size: 16384
  bound_prop_method: crown
bab:
  branching:
    method: sb
    input_split:
      enable: true
      reorder_bab: true
      # After shared-input lowering, the output-difference constraint is the
      # first row. Score that row when method is changed to sb.
      sb_primary_spec: 0
      # The default 1e-3 lets tiny lA coefficient differences dominate the
      # input-width term on this benchmark, causing many poor SB splits.
      sb_coeff_thresh: 0.1
  clip_n_verify:
    clip_input_domain:
      enabled: true
attack:
  pgd_order: before
  pgd_restarts: 10000
  pgd_restart_when_stuck: true
